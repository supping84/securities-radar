<!doctype html>
<html lang="ko"><head><meta charset="utf-8">

<title>증권사 레이더</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --plane:#f3f4f7; --surface:#ffffff; --surface2:#f7f8fa; --ink:#14171c; --ink2:#5b6270; --muted:#8a91a0;
  --line:#e3e6ec; --line2:#eef0f4; --accent:#2a78d6; --accent-soft:#e6f0fb; --accent-ink:#1c5cab;
  --up:#006300; --down:#d03b3b; --warn:#b26a00; --chip:#eceff4; --nav-h:58px;
  --grid:#e6e8ee; --axis:#c3c6cf;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --plane:#0e1013; --surface:#181b21; --surface2:#1f232a; --ink:#f1f3f6; --ink2:#b3b9c5; --muted:#7f8695;
    --line:#2a2f38; --line2:#232830; --accent:#3987e5; --accent-soft:#1a2c45; --accent-ink:#86b6ef;
    --up:#0ca30c; --down:#e66767; --warn:#e0a030; --chip:#262b34; --grid:#262b34; --axis:#3a404b;
  }
}
:root[data-theme="dark"]{
  --plane:#0e1013; --surface:#181b21; --surface2:#1f232a; --ink:#f1f3f6; --ink2:#b3b9c5; --muted:#7f8695;
  --line:#2a2f38; --line2:#232830; --accent:#3987e5; --accent-soft:#1a2c45; --accent-ink:#86b6ef;
  --up:#0ca30c; --down:#e66767; --warn:#e0a030; --chip:#262b34; --grid:#262b34; --axis:#3a404b;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--plane);color:var(--ink);font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.num{font-variant-numeric:tabular-nums}
#app{min-height:100%;display:flex;flex-direction:column}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px 8px}
.hdr-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.hdr h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.hdr .upd{font-size:11px;color:var(--muted)}
.ctl{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.ctl::-webkit-scrollbar{display:none}
.chip{flex:none;padding:5px 11px;border-radius:999px;background:var(--chip);color:var(--ink2);font-size:12.5px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.chip.on{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent;font-weight:600}
.ctl select{padding:4px 8px;font-size:12.5px;border-radius:999px;flex:none}

/* main */
main{flex:1;padding:12px 16px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--ink2);letter-spacing:.02em}
.card h2 small{font-weight:400;color:var(--muted);margin-left:6px}
.note{font-size:11.5px;color:var(--muted);margin:6px 0 0}
.empty{color:var(--muted);font-size:13px;padding:12px 0;text-align:center}

/* ranking list */
.rank{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:22px 92px 1fr auto;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line2);text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row .rk{font-size:11px;color:var(--muted);text-align:right}
.row .nm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{color:var(--muted);font-weight:400;font-size:10.5px;margin-left:3px}
.row .bar{height:12px;background:var(--line2);border-radius:3px;overflow:hidden;position:relative}
.row .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:0 3px 3px 0}
.row .bar i.neg{background:var(--down)}
.row .val{font-size:13px;font-weight:600;text-align:right;min-width:64px}
.row .val small{font-weight:400;color:var(--muted);font-size:10.5px;margin-left:2px}
.row.me .nm{color:var(--accent-ink)}

/* kpi tiles */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .l{font-size:11px;color:var(--muted)}
.kpi .v{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-top:2px}
.kpi .v small{font-size:11px;font-weight:500;color:var(--ink2);margin-left:2px}
.kpi .d{font-size:11px;margin-top:2px;color:var(--muted)}
.d.up{color:var(--up)} .d.down{color:var(--down)}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -14px;padding:0 14px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 6px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:11px;position:sticky;top:0;background:var(--surface)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
tr:last-child td{border-bottom:0}
td.sub{color:var(--muted);padding-left:14px}
tr.hd td{font-weight:600;background:var(--surface2)}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:inherit;fill:var(--muted);font-size:10px}
.chart .bar{fill:var(--accent)} .chart .bar.neg{fill:var(--down)} .chart .bar.hl{fill:var(--accent-ink)}
.chart .grid{stroke:var(--grid);stroke-width:1} .chart .axis{stroke:var(--axis);stroke-width:1}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.08}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .lbl{fill:var(--ink);font-weight:600;font-size:10.5px}
.chart .hit{fill:transparent}
.chart .tip{fill:var(--ink);font-weight:600;font-size:11px}
.chart .tipbg{fill:var(--surface);stroke:var(--line);rx:4}

/* segmented */
.seg{display:flex;background:var(--chip);border-radius:9px;padding:3px;gap:2px;margin-bottom:10px}
.seg button{flex:1;padding:6px 4px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.inline-ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:12px;color:var(--ink2)}

/* exec list */
.plist{display:flex;flex-direction:column}
.p{border-bottom:1px solid var(--line2);padding:8px 0}
.p:last-child{border-bottom:0}
.p .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;text-align:left}
.p .nm{font-weight:600;font-size:13.5px}
.p .nm small{font-weight:400;color:var(--muted);margin-left:5px;font-size:11px}
.p .job{font-size:12px;color:var(--ink2);margin-top:1px}
.p .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--ink2)}
.tag.reg{background:var(--accent-soft);color:var(--accent-ink)}
.tag.in{background:#e3f3e3;color:var(--up)} .tag.out{background:#fbe6e6;color:var(--down)} .tag.chg{background:#fff1dc;color:var(--warn)}
:root[data-theme="dark"] .tag.in,:root:not([data-theme="light"]) .tag.in{background:#163a16}
:root[data-theme="dark"] .tag.out,:root:not([data-theme="light"]) .tag.out{background:#442222}
:root[data-theme="dark"] .tag.chg,:root:not([data-theme="light"]) .tag.chg{background:#40301a}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .tag.in{background:#e3f3e3} :root:not([data-theme="dark"]) .tag.out{background:#fbe6e6} :root:not([data-theme="dark"]) .tag.chg{background:#fff1dc} }
:root[data-theme="light"] .tag.in{background:#e3f3e3} :root[data-theme="light"] .tag.out{background:#fbe6e6} :root[data-theme="light"] .tag.chg{background:#fff1dc}
.p .career{font-size:12px;color:var(--ink2);white-space:pre-line;margin-top:6px;padding:8px 10px;background:var(--surface2);border-radius:8px}
.mv{display:grid;grid-template-columns:1fr;gap:10px}
.mv h3{margin:0 0 4px;font-size:12.5px;font-weight:600}
.mv h3 .n{color:var(--muted);font-weight:500;margin-left:4px}

/* disclosures / news */
.dl{display:flex;flex-direction:column}
.di{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--line2);text-decoration:none;color:inherit}
.di:last-child{border-bottom:0}
.di .t{font-size:13px;line-height:1.35}
.di .m{font-size:11px;color:var(--muted);grid-column:1/-1;display:flex;gap:6px;align-items:center}
.di .co{font-weight:600;color:var(--ink2)}
.di.hot .t{font-weight:600}
.badge{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--chip);color:var(--ink2)}
.badge.B{background:var(--accent-soft);color:var(--accent-ink)}
.ni{padding:10px 0;border-bottom:1px solid var(--line2)}
.ni:last-child{border-bottom:0}
.ni .t{font-size:13.5px;font-weight:600;line-height:1.35}
.ni .s{font-size:12.5px;color:var(--ink2);margin-top:3px}
.ni .m{font-size:11px;color:var(--muted);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ni a{color:var(--accent-ink);text-decoration:none}

/* 잠금 화면 */
.gate{max-width:360px;margin:48px auto 0;display:flex;flex-direction:column}
.gate input[type=password]{width:100%;padding:11px 12px;font-size:16px;margin-bottom:10px}
.gate-remember{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);margin-bottom:12px}
.gate-remember input{width:auto;padding:0;margin:0}
.gate button{background:var(--accent);color:#fff;padding:11px;border-radius:9px;font-weight:600;font-size:14px}
.gate button:disabled{opacity:.55}
.gate .note{min-height:1.2em;margin-top:10px}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:0 0 env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;color:var(--muted);font-weight:500}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent-ink)}

/* detail sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--plane);display:flex;flex-direction:column;overflow:hidden}
.sheet .hdr{padding-top:calc(env(safe-area-inset-top,0px) + 10px);top:0}
.sheet .hdr-row{align-items:center}
.sheet .back{display:flex;align-items:center;gap:4px;font-weight:600;font-size:15px}
.sheet .back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sheet main{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
.sheet .sub{font-size:11.5px;color:var(--muted)}
.range{height:6px;background:var(--line2);border-radius:3px;position:relative;margin:6px 0 2px}
.range i{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--accent);margin-left:-6px}
.range-l{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px}
.kv dt{color:var(--muted);margin:0} .kv dd{margin:0;text-align:right;font-weight:500}
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .18s ease-out} @keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}} }
@media (min-width:720px){ main{max-width:720px;margin:0 auto;width:100%} .hdr>div{max-width:720px;margin:0 auto} .kpis{grid-template-columns:repeat(4,1fr)} .mv{grid-template-columns:1fr 1fr 1fr} }
</style>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (n, d = 0) => n == null || !Number.isFinite(n) ? "–" : n.toLocaleString("ko-KR", { maximumFractionDigits: d, minimumFractionDigits: d });
const eok = n => n == null ? "–" : fmt(n / 1e8);                 // 억원
const mm = n => n == null ? "–" : fmt(n / 1e6);                  // 백만원
const pct = (n, d = 1) => n == null || !Number.isFinite(n) ? "–" : fmt(n, d) + "%";
const dartUrl = n => `https://dart.fss.or.kr/dsaf001/main.do?rcpNo=${n}`;
const MONTHS = { "1Q": 3, "2Q": 6, "3Q": 9, "4Q": 12 };
const ICONS = {
  fin: '<svg viewBox="0 0 24 24"><path d="M4 19h16M6 16V9M11 16V5M16 16v-6M21 16v-3"/></svg>',
  share: '<svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 5-7 4 4"/><path d="M3 21h18"/></svg>',
  hr: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15 20a5 5 0 0 1 6.5-4.8"/></svg>',
  news: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/></svg>',
};
const TABS = [["fin", "재무"], ["share", "주주"], ["hr", "인력"], ["news", "동향"]];

let D, S = { tab: "fin", period: null, fs: "OFS", metric: { fin: "equity", share: "per", hr: "total" }, co: "all", hrOnly: false };
try { Object.assign(S, JSON.parse(localStorage.getItem("radar.s") || "{}")); } catch {}
const save = () => { try { localStorage.setItem("radar.s", JSON.stringify({ tab: S.tab, fs: S.fs, metric: S.metric })); } catch {} };

// ---------- 지표 정의 ----------
const FIN_METRICS = [
  ["equity", "자기자본", "억"], ["assets", "총자산", "억"], ["netIncome", "순이익(누적)", "억"], ["opIncome", "영업이익(누적)", "억"],
  ["roe", "ROE(연환산)", "%"], ["opRev", "영업수익(누적)", "억"], ["labor", "인건비(누적)", "억"], ["capital", "자본금", "억"],
  ["leverage", "레버리지", "배"], ["debtRatio", "부채비율", "%"], ["ncr", "NCR", "%"],
];
const HR_METRICS = [
  ["total", "직원수", "명"], ["prodPer", "인당 생산성(세전이익)", "백만"], ["salaryAvg", "1인 평균급여", "백만"], ["laborPer", "인건비/직원", "백만"], ["tenure", "평균 근속", "년"],
  ["regularRatio", "정규직 비율", "%"], ["femaleRatio", "여성 비율", "%"],
  ["execN", "임원수", "명"], ["execReg", "등기임원", "명"], ["execUnreg", "미등기임원", "명"], ["execRatio", "직원 100명당 임원", "명"],
  ["eqPerExec", "임원 1인당 자기자본", "억"], ["capPerExec", "임원 1인당 자본금", "억"], ["pretaxPerExec", "임원 1인당 세전이익(연환산)", "억"],
  ["boardAvg", "등기이사 평균보수", "백만"], ["unregAvg", "미등기임원 평균보수", "백만"], ["over5", "보수 5억↑ 인원", "명"], ["execAge", "임원 평균연령", "세"],
];
const SHARE_METRICS = [
  ["per", "PER", "배"], ["pbr", "PBR", "배"], ["divYield", "배당수익률", "%"], ["ret1y", "1년 주가수익률", "%"], ["pos52", "52주 위치", "%"],
  ["mcap", "시가총액", "억"], ["payout", "배당성향(2025)", "%"], ["dps", "주당배당금(2025)", "원"], ["divTotal", "배당총액(2025)", "억"], ["epsDart", "EPS(2025)", "원"],
];

// 회사가 해당 기간 데이터가 없으면(3월 결산 등) 가장 가까운 이전 기간 사용
function nearest(map, period) {
  const ps = D.meta.periods.map(p => p.key); const i = ps.indexOf(period);
  for (let k = i; k >= 0; k--) if (map && map[ps[k]]) return ps[k];
  return null;
}
function finVal(id, period, fs, k) {
  if (k === "ncr") { const p = nearest(D.ncr[id], period); return { v: p ? D.ncr[id][p].ncr : null, p }; }
  const p = nearest(D.fin[id], period); if (!p) return { v: null, p };
  const f = D.fin[id][p][fs] || D.fin[id][p].OFS; if (!f) return { v: null, p };
  let v = f[k];
  if (k === "roe") v = f.netIncome != null && f.equity ? f.netIncome * (12 / MONTHS[p.slice(4)]) / f.equity * 100 : null;
  if (k === "leverage") v = f.assets && f.equity ? f.assets / f.equity : null;
  if (k === "debtRatio") v = f.liabilities != null && f.equity ? f.liabilities / f.equity * 100 : null;
  return { v, p };
}
function hrAgg(id, period) {
  const p = nearest(D.hr[id], period); if (!p) return null;
  const rows = D.hr[id][p].rows; const a = { p, total: 0, regular: 0, contract: 0, female: 0, salaryTotal: 0, tenureW: 0, tenureN: 0 };
  for (const r of rows) {
    a.total += r.total || 0; a.regular += r.regular || 0; a.contract += r.contract || 0;
    if (r.sex === "여") a.female += r.total || 0;
    a.salaryTotal += r.salaryTotal || 0;
    if (r.tenure != null && r.total) { a.tenureW += r.tenure * r.total; a.tenureN += r.total; }
  }
  a.salaryAvg = a.total ? a.salaryTotal / a.total : null;
  a.tenure = a.tenureN ? a.tenureW / a.tenureN : null;
  a.regularRatio = a.total ? a.regular / a.total * 100 : null;
  a.femaleRatio = a.total ? a.female / a.total * 100 : null;
  return a;
}
function execAt(id, period) {
  const persons = D.exec[id]; const ps = D.meta.periods.map(p => p.key); const i = ps.indexOf(period);
  for (let k = i; k >= 0; k--) { const l = persons.filter(x => x.p[ps[k]]); if (l.length) return { p: ps[k], list: l.map(x => ({ ...x, cur: x.p[ps[k]] })) }; }
  return { p: null, list: [] };
}
const isReg = e => e.reg && e.reg !== "미등기";
const age = birth => { const m = /(\d{4})/.exec(birth || ""); return m ? new Date().getFullYear() - +m[1] : null; };
function hrVal(id, period, k) {
  const a = hrAgg(id, period); const ex = execAt(id, period);
  if (k in (a || {})) return { v: a[k], p: a.p };
  if (k === "laborPer") { const f = finVal(id, period, "OFS", "labor"); return { v: f.v != null && a?.total ? f.v / a.total : null, p: f.p }; }
  if (k === "prodPer") { const f = finVal(id, period, "OFS", "pretax"); return { v: f.v != null && a?.total ? f.v * (12 / MONTHS[f.p.slice(4)]) / a.total : null, p: f.p }; }

  if (k === "eqPerExec") { const f = finVal(id, period, "OFS", "equity"); return { v: f.v != null && ex.list.length ? f.v / ex.list.length : null, p: f.p }; }
  if (k === "capPerExec") { const f = finVal(id, period, "OFS", "capital"); return { v: f.v != null && ex.list.length ? f.v / ex.list.length : null, p: f.p }; }
  if (k === "pretaxPerExec") { const f = finVal(id, period, "OFS", "pretax"); return { v: f.v != null && ex.list.length ? f.v * (12 / MONTHS[f.p.slice(4)]) / ex.list.length : null, p: f.p }; }

const parseMcap = s => { if (!s) return null; let v = 0; const j = /([\d,]+)조/.exec(s), e = /([\d,]+)억/.exec(s); if (j) v += +j[1].replace(/,/g, "") * 1e4; if (e) v += +e[1].replace(/,/g, ""); return v || null; };
function divItem(id, year, re) { const y = D.div[id]?.[year]; if (!y) return null; const k = Object.keys(y).find(k => re.test(k)); return k ? y[k] : null; }

function fmtBy(unit, v, d) {

// ---------- 차트 ----------
function barChart(items, { w = 340, h = 150, unit = "억", d } = {}) {
  // items: [{label, v}]
  const pad = { l: 8, r: 8, t: 22, b: 22 }; const W = w - pad.l - pad.r, H = h - pad.t - pad.b;
  const vs = items.map(i => i.v).filter(v => v != null); if (!vs.length) return '<div class="empty">데이터 없음</div>';
  const max = Math.max(0, ...vs), min = Math.min(0, ...vs); const span = max - min || 1;
  const y = v => pad.t + (max - v) / span * H; const bw = W / items.length;
  let s = `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">`;
  s += `<line class="axis" x1="${pad.l}" x2="${w - pad.r}" y1="${y(0)}" y2="${y(0)}"/>`;
  items.forEach((it, i) => {
    const x = pad.l + i * bw + bw * 0.2, bwid = bw * 0.6;
    if (it.v != null) {
      const top = y(Math.max(0, it.v)), bh = Math.max(1, Math.abs(y(it.v) - y(0)));
      s += `<rect class="bar ${it.v < 0 ? "neg" : ""} ${i === items.length - 1 ? "hl" : ""}" x="${x}" y="${top}" width="${bwid}" height="${bh}" rx="2"/>`;
      if (i === items.length - 1 || i === 0 || it.v === Math.max(...vs)) s += `<text class="lbl" x="${x + bwid / 2}" y="${top - 5}" text-anchor="middle">${fmtBy(unit, it.v, d)}</text>`;
      s += `<rect class="hit" x="${pad.l + i * bw}" y="${pad.t}" width="${bw}" height="${H}"><title>${esc(it.label)}: ${fmtBy(unit, it.v, d)}</title></rect>`;
    }
    s += `<text x="${x + bwid / 2}" y="${h - 6}" text-anchor="middle">${esc(it.label)}</text>`;
  });
  return s + "</svg>";
}
function lineChart(pts, { w = 340, h = 140 } = {}) {
  // pts: [[yyyymmdd, v]]
  if (!pts || pts.length < 2) return '<div class="empty">데이터 없음</div>';
  const pad = { l: 8, r: 44, t: 14, b: 20 }; const W = w - pad.l - pad.r, H = h - pad.t - pad.b;
  const vs = pts.map(p => p[1]); const max = Math.max(...vs), min = Math.min(...vs); const span = max - min || 1;
  const x = i => pad.l + i / (pts.length - 1) * W, y = v => pad.t + (max - v) / span * H;
  const path = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
  let s = `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">`;
  for (const v of [max, min]) s += `<line class="grid" x1="${pad.l}" x2="${pad.l + W}" y1="${y(v)}" y2="${y(v)}"/><text x="${pad.l + W + 4}" y="${y(v) + 3.5}">${fmt(v)}</text>`;
  s += `<path class="area" d="${path}L${x(pts.length - 1)},${y(min)}L${x(0)},${y(min)}Z"/><path class="line" d="${path}"/>`;
  const last = pts.length - 1; s += `<circle class="dot" cx="${x(last)}" cy="${y(pts[last][1])}" r="4"/>`;
  const iMax = vs.indexOf(max), iMin = vs.indexOf(min);
  s += `<text class="lbl" x="${Math.min(Math.max(x(iMax), 24), pad.l + W - 24)}" y="${y(max) - 5}" text-anchor="middle">${fmt(max)}</text>`;
  s += `<text class="lbl" x="${Math.min(Math.max(x(iMin), 24), pad.l + W - 24)}" y="${y(min) + 13}" text-anchor="middle">${fmt(min)}</text>`;
  const f = d => d.slice(2, 4) + "." + d.slice(4, 6);
  s += `<text x="${pad.l}" y="${h - 5}">${f(pts[0][0])}</text><text x="${pad.l + W}" y="${h - 5}" text-anchor="end">${f(pts[last][0])}</text>`;
  // 터치/호버 툴팁
  s += `<g class="tipg" hidden><rect class="tipbg" width="90" height="18"/><text class="tip" dx="5" dy="13"></text></g>`;
  s += `<rect class="hit" x="${pad.l}" y="${pad.t}" width="${W}" height="${H}" data-pts="${pts.length}"/>`;
  return s + "</svg>";
}
document.addEventListener("pointermove", e => {
  const hit = e.target.closest?.(".hit[data-pts]"); if (!hit) return;
  const svg = hit.ownerSVGElement, g = svg.querySelector(".tipg"), n = +hit.dataset.pts;
  const r = hit.getBoundingClientRect(); const i = Math.round((e.clientX - r.left) / r.width * (n - 1));
  const pts = svg.__pts; if (!pts || !pts[i]) return;
  const vb = svg.viewBox.baseVal; const px = (e.clientX - svg.getBoundingClientRect().left) / svg.getBoundingClientRect().width * vb.width;
  g.hidden = false; g.setAttribute("transform", `translate(${Math.min(px, vb.width - 96)},2)`);
  g.querySelector("text").textContent = `${pts[i][0].slice(0, 4)}.${pts[i][0].slice(4, 6)}.${pts[i][0].slice(6)} ${fmt(pts[i][1])}`;
});
document.addEventListener("pointerleave", e => { document.querySelectorAll(".tipg").forEach(g => g.hidden = true); }, true);

const HR_RE = /대표이사|임원|이사|감사|인사|조직|합병|분할|영업양수|영업양도|해산|자본|증자|감자|자기주식|지점|폐쇄|신설|최대주주|경영권|소송|제재|기관경고|영업정지|사명|상호/;
const HL_RE = /인사|임원|대표|사장|부사장|본부장|조직|개편|희망퇴직|구조조정|채용|공채|노조|노사|임금|임협|영입|이동|선임|사임|퇴임|승진|연임|인력|직원|연봉|성과급|보수|파업|제재|징계|기관경고|과태료|경영유의|점포|지점|합병|인수|매각|출범|신설|폐쇄|책무구조/;
function newsView(coId) {

  let disc = [];

  if (S.hrOnly) { disc = disc.filter(d => HR_RE.test(d.t)); news = news.filter(n => (n.tags || []).some(t => /인사|조직|인력/.test(t))); }

      <div class="m"><span class="co">${n.co === "all" ? "업계" : esc(co(n.co)?.name || n.co)}</span><span>${esc(n.date)}</span>${(n.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}${n.url ? `<a href="${esc(n.url)}" target="_blank" rel="noopener">출처 ↗</a>` : ""}</div></div>`).join("")}</div>`
    : `<div class="empty">아직 정리된 브리핑이 없습니다. 다음 업데이트 때 채워집니다.</div>`;
  // 최근 기사 헤드라인 (Google 뉴스 자동 수집)

  if (S.hrOnly) hl = hl.filter(x => HL_RE.test(x.t));
  hl.sort((a, b) => b.d.localeCompare(a.d));
  const seenH = new Set(); hl = hl.filter(x => { const k = x.t.replace(/\s/g, "").slice(0, 14); return !seenH.has(k) && seenH.add(k); });
  h += `</div><div class="card"><h2>최근 기사 <small>최근 30일 · ${hl.length}건 · 탭하면 기사</small></h2><div class="dl">`;
  h += hl.slice(0, 200).map(x => `<a class="di ${HL_RE.test(x.t) ? "hot" : ""}" href="${esc(x.u)}" target="_blank" rel="noopener"><span class="t">${esc(x.t)}</span><span></span><span class="m">${x.co ? `<span class="co">${esc(x.co.name)}</span>` : `<span class="co">업계</span>`}<span>${x.d.slice(2).replace(/-/g, ".")}</span><span>${esc(x.s)}</span></span></a>`).join("");
  h += `</div>${hl.length > 200 ? `<p class="note">최근 200건만 표시</p>` : ""}</div>`;

    h += `<div class="card"><h2>보수 5억원 이상 <small>${colabel(id, lastP)} · ${top.length}명</small></h2><div class="tbl-wrap"><table><thead><tr><th>이름</th><th>직위</th><th>보수(백만)</th></tr></thead><tbody>${top.slice(0, 30).map(r => `<tr><td>${esc(r.name)}</td><td style="text-align:left">${esc(r.title)}</td><td class="num">${mm(r.total)}</td></tr>`).join("")}</tbody></table></div>${top.length > 30 ? `<p class="note">상위 30명만 표시</p>` : ""}</div>`; }
  // 명단
  const order = ["회장", "부회장", "사장", "부사장", "전무", "상무", "상무보", "이사"]; const rank = t => { const i = order.findIndex(o => (t || "").includes(o)); return i < 0 ? 99 : i; };
  const sorted = [...L].sort((a, b) => (isReg(b.cur) - isReg(a.cur)) || rank(a.cur.title) - rank(b.cur.title));
  h += `<div class="card"><h2>임원 명단 <small>${colabel(id, ex.p)} · 탭하면 경력</small></h2><div class="plist">${sorted.map(x => pl(x, ex.p)).join("")}</div></div>`;
  return h;
}

// ---------- 이벤트 ----------
document.addEventListener("click", e => {
  const t = e.target.closest("button, a"); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; save(); render(); window.scrollTo(0, 0); return; }
  if (t.dataset.metric) { S.metric[S.tab] = t.dataset.metric; save(); render(); return; }
  if (t.dataset.toggle === "hrOnly") { S.hrOnly = !S.hrOnly; render(); return; }
  if (t.dataset.co) { openDetail(t.dataset.co); return; }
  if (t.id === "back") { closeDetail(); return; }
  if (t.dataset.sec) { $("#sheet").__sec = t.dataset.sec; drawDetail(); return; }
  if (t.dataset.person) { const c = t.parentElement.querySelector(".career"); c.hidden = !c.hidden; return; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "periodSel") { S.period = t.value; render(); }
  if (t.id === "fsSel") { S.fs = t.value; save(); if (!$("#sheet").hidden) drawDetail(); else render(); }
  if (t.id === "coSel") { S.co = t.value; render(); }
  if (t.id === "fmSel") { $("#sheet").__fm = t.value; drawDetail(); }
  if (t.id === "fromSel") { $("#sheet").__from = t.value; drawDetail(); }
  if (t.id === "toSel") { $("#sheet").__to = t.value; drawDetail(); }
});
// 라인차트 데이터 바인딩 (툴팁용)
const mo = new MutationObserver(() => { document.querySelectorAll("svg.chart .hit[data-pts]").forEach(h => { const svg = h.ownerSVGElement; if (!svg.__pts) { const id = $("#sheet").__id; svg.__pts = D.price[id]?.weekly; } }); });
mo.observe(document.body, { childList: true, subtree: true });

// ---------- 데이터 로드 ----------
// 세 가지 배포 형태: ① 단일 HTML(inlineData) ② 로컬/아티팩트(data.json) ③ 웹 공유(data.enc, 비밀번호)
function boot(d) { D = d; S.period = D.meta.periods.at(-1).key; render(); }
const fail = m => { $("#main").innerHTML = `<div class="card"><div class="empty">${esc(m)}</div></div>`; };
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw, meta) {
  const kb = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(meta.salt), iterations: +meta.iter, hash: "SHA-256" },
    kb, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const buf = await fetch("data.enc").then(r => { if (!r.ok) throw new Error("데이터 파일을 찾을 수 없습니다"); return r.arrayBuffer(); });
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(meta.iv) }, key, buf);
  return JSON.parse(new TextDecoder().decode(plain));
}
function openGate(meta) {
  $("#nav").hidden = true; $("#ctl").hidden = true;
  $("#main").innerHTML = `<form class="card gate" id="gateForm">
    <h2 style="font-size:15px;color:var(--ink)">잠금 해제</h2>
    <p class="note" style="margin:0 0 12px">25개 증권사 재무·인력·임원 데이터입니다. 공유받은 비밀번호를 입력하세요.</p>
    <input id="gatePw" type="password" autocomplete="current-password" placeholder="비밀번호" aria-label="비밀번호">
    <label for="gateRemember" class="gate-remember"><input type="checkbox" id="gateRemember" checked> 이 기기에서 기억</label>
    <button type="submit" id="gateGo">열기</button>
    <p class="note" id="gateMsg" role="status"></p></form>`;
  const form = $("#gateForm"), pw = $("#gatePw"), msg = $("#gateMsg"), go = $("#gateGo");
  const tryPw = async (v, auto) => {
    if (!v) return;
    go.disabled = true; msg.textContent = "여는 중…";
    try {
      const d = await unlock(v, meta);
      try { $("#gateRemember").checked ? localStorage.setItem("radar.pw", v) : localStorage.removeItem("radar.pw"); } catch {}
      $("#nav").hidden = false; $("#ctl").hidden = false; boot(d);
    } catch (e) {
      go.disabled = false;
      msg.textContent = /찾을 수 없/.test(e.message) ? e.message : "비밀번호가 맞지 않습니다";
      if (auto) { try { localStorage.removeItem("radar.pw"); } catch {} }
      pw.value = ""; pw.focus();
    }
  };
  form.addEventListener("submit", e => { e.preventDefault(); tryPw(pw.value, false); });
  let saved = null; try { saved = localStorage.getItem("radar.pw"); } catch {}
  if (saved) tryPw(saved, true); else pw.focus();
}

const inlineEl = document.getElementById("inlineData"), encEl = document.getElementById("encMeta");
if (inlineEl) { try { boot(JSON.parse(inlineEl.textContent)); } catch (e) { fail("데이터를 읽지 못했습니다: " + e.message); } }
else if (encEl) openGate(encEl.dataset);
else fetch("data.json").then(r => r.json()).then(boot).catch(e => fail("데이터를 불러오지 못했습니다: " + e.message));
</script>
